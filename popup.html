<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #15202b;
      color: #e7e9ea;
    }
    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid #2f3336;
    }
    header img { width: 24px; height: 24px; }
    header h1 { font-size: 15px; font-weight: 600; }
    header .count {
      margin-left: auto;
      background: #1d9bf0;
      color: white;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
    }
    #empty {
      padding: 24px 16px;
      color: #6e767d;
      font-size: 13px;
      text-align: center;
    }
    ul { list-style: none; max-height: 400px; overflow-y: auto; }
    li {
      padding: 10px 16px;
      border-bottom: 1px solid #2f3336;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    li:last-child { border-bottom: none; }
    .tco { font-size: 11px; color: #6e767d; }
    .expanded {
      font-size: 13px;
      color: #1d9bf0;
      text-decoration: none;
      word-break: break-all;
    }
    .expanded:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon32.png">
    <h1>URL Cleaner</h1>
    <span class="count" id="count">0</span>
  </header>
  <div id="empty">No resolved links on this page yet.</div>
  <ul id="list"></ul>
  <script src="popup.js"></script>
</body>
</html>
