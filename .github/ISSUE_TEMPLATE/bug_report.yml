name: Bug report
description: A link is not resolved, resolves wrong, or the extension misbehaves
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happens, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open https://x.com/...
        2. Click ...
        3. ...
    validations:
      required: true
  - type: input
    id: post
    attributes:
      label: Post URL
      description: A public post where it happens, if there is one.
      placeholder: https://x.com/user/status/123
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Edge
        - Brave
        - Other (say which in the description)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown in chrome://extensions or about:addons.
      placeholder: "1.1.3"
    validations:
      required: true
  - type: dropdown
    id: logged-in
    attributes:
      label: Logged in to X?
      description: X loads posts differently when you are logged out.
      options:
        - "Yes"
        - "No"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
      description: Optional. Errors from the page's developer console help a lot.
