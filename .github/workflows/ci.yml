name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: AutomationDojo/reusable-cicd/.github/workflows/node-build-and-test-pr.yml@caed38801492a672fe8410fd30d5e43578bc185a # v1.16.0
    with:
      node-version: "26"
      build-cmd: npm test && npm run build
      skip-typecheck: true
      lint-cmd: echo "no lint configured"
