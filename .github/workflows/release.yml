name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    uses: AutomationDojo/reusable-cicd/.github/workflows/node-release.yml@main
    with:
      node-version: "22"
      build-cmd: npm run build
      lint-cmd: echo "no lint configured"
      extra-plugins: "@semantic-release/changelog @semantic-release/git conventional-changelog-conventionalcommits"
    secrets:
      GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
