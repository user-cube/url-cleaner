name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Uses a GitHub App token, so the release PRs it opens trigger CI
  release-please:
    uses: AutomationDojo/reusable-cicd/.github/workflows/release-please.yml@2983ecf3336c4eadc3178c10996e7fd1f0758ade # v1.16.1
    secrets:
      GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}

  upload-assets:
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag-name }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Upload extension packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag-name }}
        run: gh release upload "$TAG_NAME" url-cleaner-chrome.zip url-cleaner-firefox.zip --clobber

      # Hand the packages to the store jobs below
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-packages
          path: |
            url-cleaner-chrome.zip
            url-cleaner-firefox.zip

  # Store publishing runs only once the PUBLISH_TO_STORES repository variable is
  # "true", so releases keep working before the store credentials are set up.
  # Each store reviews the version before users get it.
  publish-chrome:
    needs: [release-please, upload-assets]
    if: needs.release-please.outputs.release-created == 'true' && vars.PUBLISH_TO_STORES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for Workload Identity Federation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-packages

      # Short-lived Google token for the url-cleaner-cws service account; no key
      # or refresh token is stored.
      - uses: AutomationDojo/reusable-cicd/.github/actions/chrome-webstore-publish@2983ecf3336c4eadc3178c10996e7fd1f0758ade # v1.16.1
        with:
          zip: url-cleaner-chrome.zip
          extension-id: anlndofbmkhpckmfbnebmboibmeiblcj
          publisher-id: ${{ secrets.CWS_PUBLISHER_ID }}
          workload-identity-provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service-account: ${{ vars.CWS_SERVICE_ACCOUNT }}

  publish-firefox:
    needs: [release-please, upload-assets]
    if: needs.release-please.outputs.release-created == 'true' && vars.PUBLISH_TO_STORES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-packages

      # Submits without waiting for the review to finish
      - uses: AutomationDojo/reusable-cicd/.github/actions/firefox-amo-publish@2983ecf3336c4eadc3178c10996e7fd1f0758ade # v1.16.1
        with:
          zip: url-cleaner-firefox.zip
          api-key: ${{ secrets.AMO_JWT_ISSUER }}
          api-secret: ${{ secrets.AMO_JWT_SECRET }}
          node-version: "26"
