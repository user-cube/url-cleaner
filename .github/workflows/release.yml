name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # An app token is needed because PRs opened with GITHUB_TOKEN do not trigger CI.
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  upload-assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Upload extension packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" url-cleaner-chrome.zip url-cleaner-firefox.zip --clobber

      # Hand the packages to the store jobs below
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-packages
          path: |
            url-cleaner-chrome.zip
            url-cleaner-firefox.zip

  # Store publishing runs only once the PUBLISH_TO_STORES repository variable is
  # "true", so releases keep working before the store credentials are set up.
  # Each store reviews the version before users get it.
  publish-chrome:
    needs: [release-please, upload-assets]
    if: needs.release-please.outputs.release_created == 'true' && vars.PUBLISH_TO_STORES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for Workload Identity Federation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          sparse-checkout: scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-packages

      # Short-lived Google token for the url-cleaner-cws service account; no key
      # or refresh token is stored.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        id: google
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload and publish to the Chrome Web Store
        env:
          ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          EXTENSION_ID: anlndofbmkhpckmfbnebmboibmeiblcj
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: scripts/publish-chrome.sh url-cleaner-chrome.zip

  publish-firefox:
    needs: [release-please, upload-assets]
    if: needs.release-please.outputs.release_created == 'true' && vars.PUBLISH_TO_STORES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension-packages

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # web-ext signs a directory, and the Firefox manifest only exists in the built zip
      - run: unzip -q url-cleaner-firefox.zip -d firefox

      - name: Submit to addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        # Submit without waiting for the review to finish
        run: npx --yes web-ext@10.8.0 sign --source-dir firefox --channel listed --approval-timeout 0
